<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discipline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Discipline</h1>
      <p class="tagline">Don't break the chain.</p>
    </header>

    <section class="add-habit">
      <input type="text" id="habitInput" placeholder="Add a habit..." autocomplete="off">
      <button id="addBtn">Add</button>
    </section>

    <section class="habits" id="habitsList">
      <!-- habits appear here -->
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
